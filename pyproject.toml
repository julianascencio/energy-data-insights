[project]
name = "energy-data-insights"
version = "0.1.0"
description = "Reusable energy data retrieval, scientific methods, and country analyses"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
imagery = [
  "orbital-pv[ground] @ git+https://github.com/julianascencio/orbital-pv.git@498c47e182f9f0e1b0f0d40bc3125ef7c2110a05 ; python_version >= '3.13'",
]
dev = [
    "packaging>=24,<27",
    "pandas-stubs>=2.2,<3",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.14,<1",
    "twine>=7,<8",
    "ty>=0.0.1,<1",
]
docs = [
    "myst-parser>=4,<5",
    "pydata-sphinx-theme>=0.16,<0.17",
    "sphinx>=8.2,<9",
    "sphinx-design>=0.6,<0.7",
    "sphinx-gallery>=0.19,<0.20",
    "sphinxcontrib-mermaid>=1,<2",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["data-retrieval", "methods", "analysis"]

[tool.uv.sources]
energy-data-retrieval = { workspace = true }
energy-methods = { workspace = true }
energy-analysis = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["data-retrieval/src", "methods/src", "analysis/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY", "RUF"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.12"
extra-paths = ["data-retrieval/src", "methods/src", "analysis/src"]

[tool.ty.src]
include = ["data-retrieval", "methods", "analysis", "scripts", "benchmarks"]
exclude = ["**/dist/**", "**/build/**"]

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["data-retrieval/tests", "methods/tests", "analysis/tests", "tests"]
addopts = "--strict-config --strict-markers --import-mode=importlib -ra"
filterwarnings = ["error"]
markers = [
    "integration: tests spanning packages with local files and no live provider calls",
]

[tool.coverage.run]
branch = true
source = ["energy_data_retrieval", "energy_methods", "energy_analysis"]

[tool.coverage.report]
show_missing = true
skip_covered = true
