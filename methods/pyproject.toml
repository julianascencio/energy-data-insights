[project]
name = "energy-methods"
version = "0.1.0"
description = "Country-neutral PV performance methods with explicit scientific assumptions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "xarray>=2025.1,<2027",
  "numpy>=2.2,<2.4",
  "pandas>=2.2,<3",
  "scipy>=1.15,<2",
  "pvlib>=0.13,<0.17",
  "lightgbm>=4.6,<5",
  "scikit-learn>=1.6,<2",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_methods"]

[project.scripts]
energy-kgpv = "energy_methods.kgpv_cli:main"
energy-degradation = "energy_methods.degradation_cli:main"
