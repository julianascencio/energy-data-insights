[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "energy-data-retrieval"
version = "0.1.0"
description = "Auditable, bounded retrieval of public energy and weather data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "scipy>=1.15,<2",
  "h5netcdf>=1.6,<2",
  "xarray>=2025.1,<2027",
  "httpx>=0.28,<1",
  "numpy>=2.2,<2.4",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pyarrow>=19,<25",
  "rasterio>=1.4,<2",
]

[project.optional-dependencies]
imagery = [
  "orbital-pv[ground] @ git+https://github.com/julianascencio/orbital-pv.git@498c47e182f9f0e1b0f0d40bc3125ef7c2110a05 ; python_version >= '3.13'",
]
era5-native = ["icechunk>=1.1,<2", "xarray>=2025.1,<2027", "zarr>=3,<4"]
cds = [
    "cdsapi>=0.7.7,<1",
]

[project.scripts]
energy-retrieve = "energy_data_retrieval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_data_retrieval"]

[project.urls]
Repository = "https://github.com/julianascencio/energy-data-insights"
Documentation = "https://julianascencio.github.io/energy-data-insights/"
Issues = "https://github.com/julianascencio/energy-data-insights/issues"

[tool.hatch.metadata]
allow-direct-references = true
