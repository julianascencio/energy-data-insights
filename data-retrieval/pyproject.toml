[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "energy-data-retrieval"
version = "0.1.0"
description = "Auditable, bounded retrieval of public energy and weather data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "scipy>=1.15,<2",
  "h5netcdf>=1.6,<2",
  "xarray>=2025.1,<2027",
  "httpx>=0.28,<1",
  "numpy>=2.2,<2.4",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pyarrow>=19,<25",
]

[project.optional-dependencies]
era5-native = ["icechunk>=1.1,<2", "xarray>=2025.1,<2027", "zarr>=3,<4"]
cds = [
    "cdsapi>=0.7.7,<1",
]

[project.scripts]
energy-retrieve = "energy_data_retrieval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_data_retrieval"]

[project.urls]
Repository = "https://github.com/julianascencio/energy-data-insights"
Documentation = "https://github.com/julianascencio/energy-data-insights/tree/main/data-retrieval"
Issues = "https://github.com/julianascencio/energy-data-insights/issues"
