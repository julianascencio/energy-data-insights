name: Publish packages to PyPI

on:
  push:
    tags:
      - data-retrieval-v*
      - methods-v*
      - analysis-v*

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      package: ${{ steps.release.outputs.package }}
      version: ${{ steps.release.outputs.version }}
      environment: ${{ steps.release.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit on main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Validate tag and package version
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release_plan.py "$RELEASE_TAG" --output "$GITHUB_OUTPUT"

  quality:
    needs: plan
    uses: ./.github/workflows/ci.yml

  build:
    needs: [plan, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PACKAGE: ${{ needs.plan.outputs.package }}
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          python-version: "3.12"
          enable-cache: true
      - name: Install release checks
        run: uv sync --locked --only-dev
      - name: Build the tagged package from its source distribution
        run: uv build --no-sources --package "$PACKAGE" --out-dir dist
      - name: Validate distribution metadata
        run: uv run --no-sync twine check --strict dist/*
      - name: Install the wheel with public PyPI dependencies
        run: uv run --no-sync python scripts/check_wheels.py --package "$PACKAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: ${{ needs.plan.outputs.environment }}
      url: https://pypi.org/project/${{ needs.plan.outputs.package }}/${{ needs.plan.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-distributions
          path: dist
      - name: Publish wheel and source distribution with attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
