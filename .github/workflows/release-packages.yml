name: Release all packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.pypi-initial-release]

permissions:
  contents: read

concurrency:
  group: release-all-packages
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      data_retrieval_tag: ${{ steps.release.outputs.data_retrieval_tag }}
      methods_tag: ${{ steps.release.outputs.methods_tag }}
      analysis_tag: ${{ steps.release.outputs.analysis_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit on main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Require the repository PyPI API token
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_API_TOKEN" ]; then
            echo "::error::Add PYPI_API_TOKEN in this repository's Actions secrets, then rerun this workflow."
            exit 1
          fi
      - name: Validate all committed package versions
        id: release
        run: python3 scripts/release_plan.py --all --output "$GITHUB_OUTPUT"

  retrieval:
    needs: plan
    uses: ./.github/workflows/publish-pypi.yml
    with:
      release_tag: ${{ needs.plan.outputs.data_retrieval_tag }}
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

  methods:
    needs: [plan, retrieval]
    uses: ./.github/workflows/publish-pypi.yml
    with:
      release_tag: ${{ needs.plan.outputs.methods_tag }}
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

  analysis:
    needs: [plan, methods]
    uses: ./.github/workflows/publish-pypi.yml
    with:
      release_tag: ${{ needs.plan.outputs.analysis_tag }}
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
