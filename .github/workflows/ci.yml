name: Python quality and tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ruff, ty, tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.4"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked workspace
        run: uv sync --locked --all-packages --python ${{ matrix.python }}
      - name: Check formatting
        run: uv run --no-sync ruff format --check .
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Type check
        run: uv run --no-sync ty check
      - name: Check repository hygiene
        run: uv run --no-sync python scripts/check_repository.py
      - name: Test
        run: uv run --no-sync pytest --cov --cov-report=term-missing
      - name: Build all distributions
        run: uv build --all-packages --out-dir dist
      - name: Run reproducible synthetic example
        run: uv run --no-sync energy-chile demo --output artifacts/ci-demo
