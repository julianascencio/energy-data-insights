name: License packaging
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  license-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - name: Build distributions and verify license metadata and contents
        shell: python
        run: |
          import email
          import pathlib
          import subprocess
          import tarfile
          import tempfile
          import tomllib
          import zipfile

          root = pathlib.Path.cwd()
          expected = (root / "LICENSE").read_bytes()
          expression = "LicenseRef-ASVA-Noncommercial-1.0"
          paths = subprocess.check_output(
              ["git", "ls-files", "*pyproject.toml"], text=True
          ).splitlines()
          built = 0
          for filename in paths:
              path = root / filename
              config = tomllib.loads(path.read_text())
              project = config.get("project")
              if not project:
                  continue
              assert project["license"] == expression, filename
              assert (path.parent / "LICENSE").read_bytes() == expected, filename
              if "build-system" not in config:
                  continue
              with tempfile.TemporaryDirectory() as temp:
                  subprocess.run(
                      ["python", "-m", "build", str(path.parent), "--outdir", temp],
                      check=True,
                  )
                  archives = list(pathlib.Path(temp).iterdir())
                  assert len(archives) == 2, archives
                  for archive in archives:
                      if archive.suffix == ".whl":
                          with zipfile.ZipFile(archive) as z:
                              files = {n: z.read(n) for n in z.namelist()
                                       if not n.endswith("/")}
                          metadata = [v for n, v in files.items()
                                      if n.endswith(".dist-info/METADATA")]
                      else:
                          with tarfile.open(archive) as t:
                              files = {m.name: t.extractfile(m).read()
                                       for m in t.getmembers() if m.isfile()}
                          metadata = [v for n, v in files.items()
                                      if n.count("/") == 1 and n.endswith("/PKG-INFO")]
                      assert len(metadata) == 1, archive
                      meta = email.message_from_bytes(metadata[0])
                      assert meta["License-Expression"] == expression, archive
                      assert "LICENSE" in meta.get_all("License-File", []), archive
                      assert any(n.endswith("/LICENSE") and v == expected
                                 for n, v in files.items()), archive
                      assert any(n.endswith("/LICENSING.md") for n in files), archive
                      print(f"Verified {archive.name}", flush=True)
                  built += 1
          assert built, "No distributable packages found"
          print(f"Verified wheel and sdist for {built} packages", flush=True)
