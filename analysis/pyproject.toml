[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "energy-analysis"
version = "0.1.0"
description = "Country-specific reproducible renewable-energy analyses"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "energy-methods>=0.1.0,<1",
  "energy-data-retrieval>=0.1.0,<1",
  "numpy>=2.2,<2.4",
  "pandas>=2.2,<3",
  "pyarrow>=19,<25",
  "rasterio>=1.4,<2",
  "matplotlib>=3.10,<4",
  "plotly>=6.3,<7",
  "xarray>=2025.1,<2027",
  "httpx>=0.28,<1",
]

[project.scripts]
energy-ccya = "energy_analysis.ccya_case.cli:main"
energy-chile = "energy_analysis.chile_fleet.cli:main"
energy-degradation-study = "energy_analysis.degradation.cli:main"

[tool.uv.sources]
energy-methods = { workspace = true }
energy-data-retrieval = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/energy_analysis"]

[project.urls]
Repository = "https://github.com/julianascencio/energy-data-insights"
Documentation = "https://julianascencio.github.io/energy-data-insights/"
Issues = "https://github.com/julianascencio/energy-data-insights/issues"
